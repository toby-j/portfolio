<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Toby Johnson's Portfolio Webpage</title>
    <meta name="description" content="Toby Johnson's Portfolio Webpage" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        primary: 'hsl(var(--primary))',
                        'primary-foreground': 'hsl(var(--primary-foreground))',
                    },
                    borderRadius: {
                        DEFAULT: 'var(--radius)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <style>
        @layer base {
            body {
                font-family: 'Inter', sans-serif;
            }

            :root {
                --background: 224 71.4% 4.1%;
                --foreground: 210 20% 98%;
                --muted: 215 27.9% 16.9%;
                --muted-foreground: 217.9 10.6% 64.9%;
                --primary: 210 20% 98%;
                --primary-foreground: 220.9 39.3% 11%;
                --radius: 0.5rem;
            }

            :root:has(#lightmode:checked) {
                --background: 0 0% 100%;
                --foreground: 222.2 47.4% 11.2%;
                --muted: 210 40% 96.1%;
                --muted-foreground: 215.4 16.3% 46.9%;
                --primary: 222.2 47.4% 11.2%;
                --primary-foreground: 210 40% 98%;
                --radius: 0.5rem;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .fade-in {
                animation: fadeIn 1.5s ease-out forwards;
                opacity: 0;
            }

            .fade-in-delay {
                animation: fadeIn 1.2s ease-out 0.4s forwards;
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-background text-foreground min-h-screen flex flex-col">
<!-- Theme Toggle -->
<input type="checkbox" id="lightmode" class="hidden peer" />
<label
        for="lightmode"
        class="fixed top-4 right-4 z-10 flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg bg-primary text-primary-foreground transition hover:opacity-90 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/50"
        aria-label="Toggle light/dark theme"
>
    <!-- Sun Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         class="h-5 w-5 absolute rotate-0 scale-100 transition-all duration-500 peer-checked:-rotate-90 peer-checked:scale-0">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>

    <!-- Moon Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         class="h-5 w-5 absolute -rotate-90 scale-0 transition-all duration-500 peer-checked:rotate-0 peer-checked:scale-100">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
    </svg>

    <span class="sr-only">Toggle theme</span>
</label>

<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center gap-6 px-6 py-10 md:gap-8 md:py-0">
    <h1 class="text-5xl sm:text-6xl md:text-7xl font-bold text-center leading-tight fade-in">
        Toby Johnson
    </h1>

    <p class="text-base sm:text-lg md:text-xl text-muted-foreground text-center max-w-xl fade-in-delay">
        Full-Stack Software Engineer
    </p>

    <!-- Clickable Panda Icon -->
    <a
            href="https://bepanda.co.uk/"
            target="_blank"
            rel="noopener noreferrer"
            class="fade-in-delay inline-block rounded-full transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-primary/50"
            aria-label="Visit bepanda.co.uk"
    >
        <svg
                class="h-8 w-8 sm:h-10 sm:w-10 md:h-12 md:w-12 lg:h-14 lg:w-14 object-contain text-foreground hover:opacity-80 transition-opacity"
                viewBox="0 0 443 444"
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                xml:space="preserve"
                fill="currentColor"
        >
                <g transform="matrix(1,0,0,1,-455.651,-250.836)">
                    <g transform="matrix(4.16667,0,0,4.16667,0,0)">
                        <g id="art">
                            <g transform="matrix(1,0,0,1,162.435,166.618)">
                                <path d="M0,-106.417C29.388,-106.417 53.21,-82.597 53.21,-53.209C53.21,-23.821 29.388,0 0,0C-20.564,0 -38.4,-11.668 -47.259,-28.742C-38.687,-20.942 -25.943,-24.021 -19.178,-31.472C-8.829,-25.399 5.446,-26.965 12.498,-35.843C19.408,-40.78 26.981,-37.169 32.295,-33.786L32.295,-58.831C32.295,-81.059 14.276,-99.075 -7.947,-99.075L-26.978,-99.075C-19.067,-103.739 -9.847,-106.417 0,-106.417" />
                            </g>
                            <g transform="matrix(1,0,0,1,122.438,125.067)">
                                <path d="M0,8.198C3.445,8.235 8.072,4.142 7.419,2.011C6.794,-0.037 -6.641,0.699 -7.207,2.432C-7.769,4.144 -4.974,8.145 0,8.198" />
                            </g>
                            <g transform="matrix(1,0,0,1,115.251,62.307)">
                                <path d="M0,26.486C-10.071,14.908 8.178,0 17.562,16.965C11.462,17.609 5.124,20.645 0,26.486" />
                            </g>
                            <g transform="matrix(1,0,0,1,175.438,69.1823)">
                                <path d="M0,33.493C13.768,15.301 -7.281,0 -20.39,13.493C-10.372,15.873 -2.167,26.235 0,33.493" />
                            </g>
                            <g transform="matrix(-0.925089,-0.37975,-0.37975,0.925089,144.749,115.859)">
                                <path d="M-1.508,-18.786C-9.416,-17.754 -15.827,-12.987 -15.826,-8.137C-15.828,-3.284 -10.458,1.804 -1.508,-1.225C6.048,-3.781 11.328,-7.242 12.811,-11.876C14.294,-16.494 6.4,-19.819 -1.508,-18.786" />
                            </g>
                            <g transform="matrix(1,0,0,1,112.888,107.48)">
                                <path d="M0,-7.7C-3.703,-2.487 -4.645,4.037 -2.104,6.871C0.294,9.546 4.048,-0.305 9.237,-4.498C16.07,-10.902 6.777,-17.246 0,-7.7" />
                            </g>
                        </g>
                    </g>
                </g>
            </svg>
    </a>
</main>
</body>
</html>
